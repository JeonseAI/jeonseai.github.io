<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전세AI프</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="등기부등본 사진 한 장으로 전세 위험을 쉬운 말로 알려주는 앱">
<style>
  :root { --green:#14724B; --bg:#F6F8F6; --text:#1B2420; --sub:#5A6660; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); padding:24px 16px;
         font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width:420px; width:100%; text-align:center; }
  .badge { display:inline-block; padding:6px 14px; border-radius:999px;
           background:var(--green); color:#fff; font-size:14px; font-weight:600; }
  h1 { margin-top:20px; font-size:40px; letter-spacing:-0.5px; color:var(--green); }
  p { margin-top:14px; font-size:17px; line-height:1.6; color:var(--sub); }
  .team { margin-top:32px; font-size:14px; color:var(--sub); }
</style>
</head>
<body>
<main>
  <span class="badge">준비 중</span>
  <h1>전세AI프</h1>
  <p>등기부등본 사진 한 장으로<br>전세 위험을 쉬운 말로 알려드려요.</p>
  <p class="team">팀 동크크 · 2026 AI ROOKIE</p>
</main>
</body>
</html>
